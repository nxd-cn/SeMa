name: publish-release

# Only when a v* tag is pushed (e.g. git push origin v1.2.3).
# Do NOT use `on: release` here: GitHub currently opens empty failed
# check suites (event=push, 0 jobs) on every master push for release-only
# workflows in this repo. Tag filter does not run on ordinary branch pushes.
on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Tag v1.2.3 → package / Cargo / bundle filenames use 1.2.3.
      - name: Set app version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Tag must look like v1.2.3 (got: ${GITHUB_REF_NAME})"
            exit 1
          fi
          echo "Release version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${version}"`);
            fs.writeFileSync("src-tauri/Cargo.toml", cargo);
            console.log("Cargo.toml version ->", version);
          ' "$VERSION"

      # Prefer existing Release body → GitHub auto-generated notes → fixed fallback.
      # Notes land in latest.json and the in-app update dialog.
      - name: Resolve release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=""

          if EXISTING=$(gh release view "${GITHUB_REF_NAME}" --json body -q .body 2>/dev/null); then
            if [[ -n "$(printf '%s' "$EXISTING" | tr -d '[:space:]')" ]]; then
              NOTES="$EXISTING"
              echo "Using existing Release notes"
            fi
          fi

          if [[ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]]; then
            NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq .body 2>/dev/null || true)
            if [[ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]]; then
              echo "Using GitHub-generated Release notes"
            fi
          fi

          if [[ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]]; then
            echo "No Release notes; using fixed fallback"
            NOTES=$(cat <<'EOF'
有可用更新，可直接安装并重启，无需卸载。

- Windows: `*-setup.exe` (NSIS)
- macOS: `*_aarch64.dmg`（Apple Silicon）、`*_x64.dmg`（Intel）

### macOS：提示「文件已损坏 / 无法打开」时

安装到「应用程序」后在终端执行：

```bash
xattr -cr /Applications/SeMa.app
```

然后再打开 SeMa。
EOF
)
          fi

          {
            echo "body<<EOF"
            printf '%s\n' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required so createUpdaterArtifacts + latest.json.sig work.
          # Repo secret: paste contents of local .tauri/sema.key (never commit the key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SeMa ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
