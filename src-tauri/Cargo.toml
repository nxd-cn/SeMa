[package]
name = "sema"
version = "0.1.0"
description = "SeMa — multi AI CLI session manager"
authors = ["SeMa"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
parking_lot = "0.12"
dirs = "6"
thiserror = "2"
tokio = { version = "1", features = ["time", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSDockTile",
  "NSWindow",
  "NSView",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSGraphics",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
raw-window-handle = "0.6"
